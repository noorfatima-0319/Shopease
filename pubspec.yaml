name: shopease
description: "ShopEase - a Flutter e-commerce app built with BLoC/Cubit, clean architecture, Hive persistence and a cash-on-delivery checkout flow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  get_it: ^8.0.2
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
